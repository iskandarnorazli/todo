name: Update dependencies and package-lock.json

# D10: versions follow the Expo SDK. Run on a branch whose package.json changed: it installs,
# lets `expo install --fix` move each Expo-managed package to the SDK's version, and pushes
# package.json and package-lock.json to that branch. A push by this workflow does not start CI;
# dispatch CI on the branch afterwards (ci.yml has workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch whose package.json changed (not main)"
        required: true

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse main
        if: inputs.branch == 'main'
        run: |
          echo "Run this on a feature branch, then merge its PR." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install what package.json asks for
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Align Expo-managed packages with the SDK
        run: npx expo install --fix
      - name: Resolve a consistent lockfile
        run: npm install --no-audit --no-fund
      - name: Write the locked versions over any "*" range
        run: node scripts/pin-star-ranges.mjs
      - name: Show the change
        run: git diff -- package.json && git status --short
      - name: Commit and push
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo "already up to date"; exit 0; fi
          git config user.name "Iskandar Norazli"
          git config user.email "111472977+iskandarnorazli@users.noreply.github.com"
          git commit -m "Dependencies: Expo SDK versions and package-lock.json (lockfile workflow)"
          git push origin HEAD:${{ inputs.branch }}
